name: Course Validate

on:
  pull_request:
    paths:
      - 'course/**'
      - 'scripts/course_audit.py'
      - '.github/workflows/course-validate.yml'
  push:
    branches: [master]
    paths:
      - 'course/**'
      - 'scripts/course_audit.py'
      - '.github/workflows/course-validate.yml'

jobs:
  course-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate learner path
        run: python scripts/course_audit.py
      - name: Compile course Python infrastructure
        run: |
          python -m py_compile scripts/course_audit.py
          find course -path '*/project/*' -name '*.py' -print0 | xargs -0 -r python -m py_compile
      - name: Run course infrastructure regression tests
        run: python -m unittest discover -s course/05-networking-concurrency/project/tools -p 'test_*.py'
      - name: Compile controlled debugger targets
        run: |
          make -C course/08-binaries-debugging-security/project/tests/targets
          make -C course/08-binaries-debugging-security/project/tests/targets clean
