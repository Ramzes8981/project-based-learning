name: Course Validate

on:
  pull_request:
    paths:
      - 'course/**'
      - 'scripts/course_audit.py'
      - '.github/workflows/course-validate.yml'
  push:
    branches: [master]
    paths:
      - 'course/**'
      - 'scripts/course_audit.py'

jobs:
  course-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate learner path
        run: python scripts/course_audit.py
