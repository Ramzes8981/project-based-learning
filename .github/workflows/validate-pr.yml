name: Validate project catalog

on:
  pull_request:
    paths:
      - 'PROJECT_CATALOG.md'
      - 'scripts/check_readme.py'
      - 'scripts/lint-allow-duplicates.txt'
      - '.github/workflows/validate-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preserved project catalog
        run: python scripts/check_readme.py lint --readme PROJECT_CATALOG.md
