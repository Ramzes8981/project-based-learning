name: Link Rot Monitor (project catalog)

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: link-rot-monitor
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run project catalog link state checker
        run: |
          python scripts/check_readme.py \
            --mode link-state \
            --readme PROJECT_CATALOG.md \
            --state .github/link-rot-state.json \
            --report .github/link-rot-report.json
      - name: Commit state changes
        run: |
          if git diff --quiet -- .github/link-rot-state.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/link-rot-state.json
          git commit -m "chore: update project catalog link state"
          git push
